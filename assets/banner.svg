<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="accentEmerald" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><filter id="glowOrb" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="60"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".25"/></pattern><style>@keyframes floatSlow1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.08)}}@keyframes floatSlow2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-25px,25px) scale(1.05)}}@keyframes pulseBeam{0%{opacity:.2;stroke-dashoffset:0}50%{opacity:.8;stroke-dashoffset:-50}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes pingPoint{0%{r:3;opacity:1}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;letter-spacing:.2px;fill:#94a3b8}.pill-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;font-weight:600;font-size:13px;letter-spacing:.5px;text-transform:uppercase}.floating-orb1{animation:floatSlow1 12s ease-in-out infinite}.floating-orb2{animation:floatSlow2 15s ease-in-out infinite}.beam-line{stroke-dasharray:8 16;animation:pulseBeam 4s linear infinite}.radar-arm{transform-origin:1050px 100px;animation:radarSweep 8s linear infinite}.ping-circle{animation:pingPoint 2.5s cubic-bezier(0,0,.2,1) infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><g opacity=".45"><circle cx="200" cy="100" r="180" fill="#38bdf8" class="floating-orb1" filter="url(#glowOrb)"/><circle cx="1020" cy="300" r="220" fill="#a855f7" class="floating-orb2" filter="url(#glowOrb)"/><circle cx="620" cy="380" r="150" fill="#06b6d4" class="floating-orb1" filter="url(#glowOrb)"/></g><rect width="1200" height="420" fill="url(#techGrid)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 80 L 300 80 L 400 160 L 800 160 L 920 80 L 1150 80" class="beam-line"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 80 340 L 350 340 L 480 270 L 820 270 L 950 340 L 1120 340" class="beam-line"/><circle cx="400" cy="160" r="4" fill="#38bdf8"/><circle cx="800" cy="160" r="4" fill="#38bdf8"/><circle cx="480" cy="270" r="4" fill="#a855f7"/><circle cx="820" cy="270" r="4" fill="#a855f7"/></g><g opacity=".4"><circle cx="1050" cy="100" r="50" fill="none" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1"/><circle cx="1050" cy="100" r="30" fill="none" stroke="#818cf8" stroke-width="1"/><line x1="1050" x2="1100" y1="100" y2="100" stroke="#38bdf8" stroke-linecap="round" stroke-width="2" class="radar-arm"/><circle cx="1050" cy="100" r="4" fill="#38bdf8"/><circle cx="1070" cy="85" r="3" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ping-circle"/><circle cx="1070" cy="85" r="3" fill="#38bdf8"/></g><rect width="1040" height="310" x="80" y="55" fill="#0f172a" fill-opacity=".75" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)" rx="20"/><g transform="translate(120, 95)"><rect width="220" height="32" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="5" fill="#10b981"/><text x="32" y="21" fill="#38bdf8" class="pill-text">⚡ Cross-Platform QA Stack</text></g><g><text fill="url(#primaryGrad)" class="title-text" transform="translate(120, 175)">Cross-Platform Testing</text><text x="515" fill="#f8fafc" class="title-text" transform="translate(120, 175)">Developer Toolkit</text></g><g><text class="subtitle-text" transform="translate(120, 218)">Curated ecosystem of Web, Mobile, API Automation Frameworks &amp; SaaS Grids</text></g><g><g transform="translate(120, 275) translate(0, 0)"><rect width="170" height="38" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="10"/><text x="22" y="24" fill="#38bdf8" class="pill-text">🌐 Web Browsers</text></g><g transform="translate(120, 275) translate(185, 0)"><rect width="160" height="38" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="10"/><text x="20" y="24" fill="#a855f7" class="pill-text">📱 Mobile &amp; App</text></g><g transform="translate(120, 275) translate(360, 0)"><rect width="145" height="38" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="10"/><text x="20" y="24" fill="#34d399" class="pill-text">🔌 API &amp; Load</text></g><g transform="translate(120, 275) translate(520, 0)"><rect width="165" height="38" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="10"/><text x="20" y="24" fill="#f59e0b" class="pill-text">☁️ Cloud Grids</text></g><g transform="translate(120, 275) translate(700, 0)"><rect width="180" height="38" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="2 2" stroke-width="1" rx="10"/><text x="20" y="24" fill="#38bdf8" class="pill-t