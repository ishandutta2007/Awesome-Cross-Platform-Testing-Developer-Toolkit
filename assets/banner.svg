<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing accent gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      
      /* Dynamic animations */
      @keyframes floatSlow1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-25px, 25px) scale(1.05); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.2; stroke-dashoffset: 0; }
        50% { opacity: 0.8; stroke-dashoffset: -50; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pingPoint {
        0% { r: 3; opacity: 1; }
        100% { r: 16; opacity: 0; }
      }

      .floating-orb1 {
        animation: floatSlow1 12s ease-in-out infinite;
      }
      .floating-orb2 {
        animation: floatSlow2 15s ease-in-out infinite;
      }
      .beam-line {
        stroke-dasharray: 8 16;
        animation: pulseBeam 4s linear infinite;
      }
      .radar-arm {
        transform-origin: 1050px 100px;
        animation: radarSweep 8s linear infinite;
      }
      .ping-circle {
        animation: pingPoint 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Animated Ambient Glowing Orbs (Strictly in Background) -->
  <g opacity="0.45">
    <circle class="floating-orb1" cx="200" cy="100" r="180" fill="#38bdf8" filter="url(#glowOrb)" />
    <circle class="floating-orb2" cx="1020" cy="300" r="220" fill="#a855f7" filter="url(#glowOrb)" />
    <circle class="floating-orb1" cx="620" cy="380" r="150" fill="#06b6d4" filter="url(#glowOrb)" />
  </g>

  <!-- Cyber Grid Pattern Overlay -->
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- Decorative Circuit / Testing Vector Nodes in Background -->
  <g opacity="0.35">
    <path class="beam-line" d="M 50 80 L 300 80 L 400 160 L 800 160 L 920 80 L 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="beam-line" d="M 80 340 L 350 340 L 480 270 L 820 270 L 950 340 L 1120 340" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle cx="400" cy="160" r="4" fill="#38bdf8" />
    <circle cx="800" cy="160" r="4" fill="#38bdf8" />
    <circle cx="480" cy="270" r="4" fill="#a855f7" />
    <circle cx="820" cy="270" r="4" fill="#a855f7" />
  </g>

  <!-- Subtle Dynamic Radar Widget in Top-Right Corner -->
  <g opacity="0.4">
    <circle cx="1050" cy="100" r="50" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="1050" cy="100" r="30" fill="none" stroke="#818cf8" stroke-width="1" />
    <line class="radar-arm" x1="1050" y1="100" x2="1100" y2="100" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="1050" cy="100" r="4" fill="#38bdf8" />
    <circle class="ping-circle" cx="1070" cy="85" r="3" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="1070" cy="85" r="3" fill="#38bdf8" />
  </g>

  <!-- Foreground Container / Backdrop Card for Guaranteed Text Contrast -->
  <rect x="80" y="55" width="1040" height="310" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)" />

  <!-- Foreground Content: Badge Header -->
  <g transform="translate(120, 95)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" class="pill-text" fill="#38bdf8">⚡ Cross-Platform QA Stack</text>
  </g>

  <!-- Foreground Content: Main Title (Crisp, High Contrast) -->
  <g transform="translate(120, 175)">
    <text class="title-text" fill="url(#primaryGrad)">Cross-Platform Testing</text>
    <text x="515" class="title-text" fill="#f8fafc">Developer Toolkit</text>
  </g>

  <!-- Foreground Content: Subtitle -->
  <g transform="translate(120, 218)">
    <text class="subtitle-text">Curated ecosystem of Web, Mobile, API Automation Frameworks &amp; SaaS Grids</text>
  </g>

  <!-- Foreground Feature Badges / Capability Pills -->
  <g transform="translate(120, 275)">
    <!-- Pill 1: Web Automation -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="22" y="24" class="pill-text" fill="#38bdf8">🌐 Web Browsers</text>
    </g>

    <!-- Pill 2: Mobile Devices -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="160" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="20" y="24" class="pill-text" fill="#a855f7">📱 Mobile &amp; App</text>
    </g>

    <!-- Pill 3: API & Newman -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="145" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="20" y="24" class="pill-text" fill="#34d399">🔌 API &amp; Load</text>
    </g>

    <!-- Pill 4: Cloud SaaS Grids -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="165" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="20" y="24" class="pill-text" fill="#f59e0b">☁️ Cloud Grids</text>
    </g>

    <!-- Pill 5: 100% Developer First -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="180" height="38" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
      <text x="20" y="24" class="pill-text" fill="#38bdf8">🚀 Developer-First</text>
    </g>
  </g>
</svg>
